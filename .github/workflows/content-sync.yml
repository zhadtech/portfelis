name: Sync content

# A push to a private content repo does not move the submodule pointers recorded here, and
# deploy.yml builds exactly what is recorded. Each content repo therefore dispatches
# `content-updated` on push (the sender is in README.md → "Updating content"). This job
# moves every pointer to the tip of the branch named in .gitmodules, pushes the commit,
# and starts deploy.yml. Manual dispatch does the same for when a sender did not fire.
on:
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

# Writes use GITHUB_TOKEN, which is scoped to this repo and expires with the job.
# CONTENT_PAT only reads commit ids from the content repos, so it stays read-only.
permissions:
  contents: write # push the moved pointers
  actions: write # start deploy.yml: a push made with GITHUB_TOKEN triggers no workflow

# Its own group, not `pages`. A queued run is replaced by a newer one, which is harmless
# here because every run reads the latest tips — but in the `pages` group a queued sync
# would replace a pending deploy, and the site would miss that deploy.
concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require the content PAT
        env:
          CONTENT_PAT: ${{ secrets.CONTENT_PAT }}
        run: |
          if [ -z "$CONTENT_PAT" ]; then
            echo "::error::secrets.CONTENT_PAT is not set. The tips of the private content"
            echo "::error::repositories cannot be read, so the pointers cannot be moved."
            exit 1
          fi

      # The branch tip when the job starts, not the commit the event was queued against: a
      # run that waited behind another must commit on top of its push. No submodules: only
      # their commit ids are needed, and those come from the API below.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Move each pointer to the tip of its content repo
        env:
          GH_TOKEN: ${{ secrets.CONTENT_PAT }}
        run: |
          count=0
          while read -r key path; do
            name=${key#submodule.}
            name=${name%.path}
            url=$(git config -f .gitmodules "submodule.$name.url")
            branch=$(git config -f .gitmodules "submodule.$name.branch")
            repo=${url#https://github.com/}
            sha=$(gh api "repos/${repo%.git}/commits/$branch" --jq .sha)
            git update-index --cacheinfo "160000,$sha,$path"
            echo "$path → $sha"
            count=$((count + 1))
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$')
          if [ "$count" -eq 0 ]; then
            echo "::error::.gitmodules lists no submodules. Nothing to sync."
            exit 1
          fi

      - name: Commit, push, and deploy if anything moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then
            echo "Pointers already at the latest content. Nothing to deploy."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A fixed message on purpose. This repo is public; a submodule log in the message
          # would copy private commit messages into its history.
          git commit -m 'chore: sync private content'
          git push origin HEAD:main
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
